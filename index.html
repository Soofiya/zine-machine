<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soof's Zine Machine</title>
<meta name="description" content="A vending machine and archive of zines made by design and illustrator Soofiya — browse, filter by tag, and read.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500;600;700&family=Paytone+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-texture" aria-hidden="true"></div>

<div class="machine-page">

  <!-- ======================= HEADER / LOGO PLATE ======================= -->
  <button type="button" id="machineHeader" class="machine-header" aria-label="Soof's Zine Machine — back to browsing">
    <img src="assets/header.png" alt="Soof's Zine Machine" class="header-logo">
  </button>

  <!-- ======================= MACHINE BODY ======================= -->
  <main class="machine-body">

    <!-- decorative stickers, purely for flavour -->
    <span class="sticker sticker-1" aria-hidden="true">NEW!</span>
    <span class="sticker sticker-2" aria-hidden="true">★ Read Zines ★</span>
    <span class="sticker sticker-3" aria-hidden="true">Made by Soof</span>

    <!-- TAGS PANEL -->
    <section class="panel tag-panel" aria-label="Filter by tag">
      <h2 class="panel-label">Choose a theme</h2>

      <label for="searchInput" class="visually-hidden">Search zines</label>
      <input id="searchInput" type="search" class="search-slot" placeholder="or type to search…" autocomplete="off">

      <div class="tag-buttons" id="tagDirectory" aria-label="Tag buttons">
        <!-- tag pills injected by JS -->
      </div>

      <button id="clearFilters" class="reset-btn" type="button" hidden>⟲ reset selection</button>
    </section>

    <!-- COVER WINDOW -->
    <section class="panel window-panel" aria-label="Browse zines">
      <h2 class="panel-label">
        <span>ZINE LIBRARY</span>
        <span class="result-count" id="resultCount"></span>
      </h2>
      <div class="cover-window">
        <div class="cover-scroll" id="zineGrid" aria-live="polite">
          <!-- zine covers injected by JS -->
        </div>
      </div>
      <p class="empty-state" id="emptyState" hidden>No zines match this selection. Try another tag, or hit reset.</p>
    </section>

    <!-- VIEWER SCREEN -->
    <section class="panel viewer-panel" aria-label="Zine viewer" id="viewerPanel">
      <h2 class="panel-label">NOW READING</h2>

      <div class="viewer-screen" id="viewerScreen">
        <p class="viewer-idle" id="viewerIdle">Choose a zine from the library<br>and it'll open up right here</p>

        <div class="viewer-active" id="viewerActive" hidden>
          <button class="reader-nav reader-prev" id="readerPrev" type="button" aria-label="Previous page">&#10094;</button>
          <div class="reader-page">
            <img id="readerImg" src="" alt="">
          </div>
          <button class="reader-nav reader-next" id="readerNext" type="button" aria-label="Next page">&#10095;</button>
        </div>
      </div>

      <div class="viewer-meta" id="viewerMeta" hidden>
        <h3 id="readerTitle"></h3>
        <p id="readerBlurb"></p>
        <div id="readerTags" class="reader-tags"></div>
        <p class="reader-pagenum"><span id="readerPageNum"></span></p>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>This Zine Machine is archive of zines made by designer, illustrator and zinester Soofiya</p>
  </footer>

</div>

<script src="js/script.js"></script>
</body>
</html>
